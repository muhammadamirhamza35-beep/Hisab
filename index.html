<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="description" content="Hisab - offline daily expense tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hisab</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#0f1a1f;--muted:#6b7780;--line:#e8ecf0;--brand:#0d9488;--brand2:#e3f5f2;--red:#e5484d;--green:#12a150;--amber:#d97706;--blue:#3b82f6;--input:#f4f6f8;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);--hero:linear-gradient(135deg,#052c28 0%,#0a5d55 55%,#12a394 100%)}
[data-theme=dark]{--bg:#080c0f;--card:#11171c;--text:#e8eef2;--muted:#8b98a3;--line:#1e272e;--brand:#2dd4bf;--brand2:#0f2a27;--red:#ff6b6f;--green:#3ddc84;--amber:#fbbf24;--blue:#60a5fa;--input:#0b1014;--shadow:0 0 0 1px #182027;--hero:linear-gradient(135deg,#06201d 0%,#0b443e 55%,#0f7a70 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--hero);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
header h1{font-size:20px;font-weight:750;letter-spacing:-.4px;flex:1}
.tbtn{border:0;background:var(--card);box-shadow:var(--shadow);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600}
main{max-width:560px;margin:0 auto;padding:4px 14px 14px}
section{display:none}section.on{display:block;animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:650;margin-bottom:12px;letter-spacing:-.1px}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}.chead h2{margin:0}
.big{font-size:30px;font-weight:750;letter-spacing:-1px}
.neg{color:var(--red)}.pos{color:var(--green)}
.muted{color:var(--muted);font-size:13px}
/* hero balance card */
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(13,148,136,.28);padding:20px 18px 16px}
[data-theme=dark] .hero{box-shadow:0 12px 32px rgba(0,0,0,.4)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero:before{width:230px;height:230px;right:-80px;top:-100px}.hero:after{width:150px;height:150px;right:50px;bottom:-95px}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;color:rgba(255,255,255,.72);font-weight:500}
.hero .big{font-size:38px;margin:2px 0 2px;color:#fff}.hero .big.neg{color:#ffc2c4}
.hsub{font-size:13px;color:rgba(255,255,255,.75)}.hsub b{color:#fff}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.hstats div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 11px}
.hstats small{display:block;font-size:11.5px;color:rgba(255,255,255,.7)}.hstats b{font-size:15px;font-weight:650}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--input);border-radius:14px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:16px;font-weight:650}
/* forms */
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-weight:500}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid transparent;border-radius:12px;background:var(--input);color:var(--text);outline:0;transition:border-color .15s}
input:focus,select:focus{border-color:var(--brand)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--hero);color:#fff;font:inherit;font-weight:650;font-size:15px;box-shadow:0 6px 16px rgba(13,148,136,.25)}
.btn:active,.pbtn:active,.chip:active{transform:scale(.98)}
.err{color:var(--red);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 11px 6px 7px;font:inherit;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.chip span{font-size:15px;line-height:1}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}[data-theme=dark] .chip.on{color:#04201d}
/* lists */
ul{list-style:none}
li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.ico.sm{width:32px;height:32px;border-radius:10px;font-size:16px}
.li-main{flex:1;min-width:0}.li-main b{font-weight:600;font-size:14.5px;display:block}
.li-main small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:650;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 2px 4px 6px;opacity:.6}
.day{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:650;padding:12px 0 4px;letter-spacing:.3px;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.done .li-main b{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;flex:none;accent-color:var(--brand)}
/* donut chart */
.donut{position:relative;width:190px;height:190px;margin:2px auto 14px}
.donut svg{width:100%;height:100%;display:block}
.donut circle{transition:stroke-dasharray .5s ease}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dc small{font-size:12px;color:var(--muted)}.dc b{font-size:21px;font-weight:750;letter-spacing:-.5px}
.lg{display:flex;align-items:center;gap:10px;padding:8px 0}
.lgm{flex:1;min-width:0}.lgt{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}.lgt b{font-weight:600}
.lgb{height:6px;background:var(--input);border-radius:99px;margin-top:6px;overflow:hidden}.lgb i{display:block;height:100%;border-radius:99px}
.pct{font-size:12px;color:var(--muted);font-weight:600;width:36px;text-align:right}
/* week bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px}
.bv{font-size:10.5px;color:var(--muted);font-weight:600;min-height:14px}
.btrack{flex:1;width:100%;max-width:30px;display:flex;align-items:flex-end;background:var(--input);border-radius:9px;overflow:hidden}
.btrack i{display:block;width:100%;background:#9fd9d1;border-radius:9px;transition:height .4s ease}
[data-theme=dark] .btrack i{background:#1f5c55}
.bcol.on .btrack i{background:var(--brand)}.bcol.on .bv{color:var(--brand)}
.bcol small{font-size:11px;color:var(--muted);font-weight:600}.bcol.on small{color:var(--text)}
/* source breakdown */
.src{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px}.src .lgm b{font-weight:600}
/* insights */
.ins{position:relative;padding:13px 14px 13px 50px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;font-size:14px}
.ins:before{position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.ins.warn:before{content:"!";background:var(--red)}.ins.info:before{content:"i";background:var(--blue)}.ins.good:before{content:"✓";background:var(--green)}
.bar{height:7px;background:var(--input);border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
/* loans */
li.loan{display:block}.lhead{display:flex;align-items:center;gap:10px}.lhead b{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tag{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--brand2);color:var(--brand)}.tag.od{background:transparent;border:1px solid var(--red);color:var(--red)}
.payF{display:flex;gap:8px;margin-top:10px}.payF input{padding:9px 11px;font-size:15px}.pbtn{flex:none;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:650;font-size:13px;padding:0 14px}[data-theme=dark] .pbtn{color:#04201d}
.phist{margin-top:6px}.phist div{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.phist .del{font-size:18px}
/* bottom nav */
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;display:flex;background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(16,24,40,.14);padding:6px;z-index:5}
[data-theme=dark] nav{box-shadow:0 0 0 1px #1e272e,0 8px 30px rgba(0,0,0,.5)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;padding:6px 0 5px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand);background:var(--brand2)}
nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<header>
  <div class="logo">৳</div>
  <h1 data-i="appName">Hisab</h1>
  <button class="tbtn" id="langBtn">বাংলা</button>
  <button class="tbtn" id="themeBtn">Night</button>
</header>

<main>
<!-- HOME -->
<section id="home" class="on">
  <div class="card hero">
    <div class="lbl" data-i="moneyLeft"></div>
    <div class="big" id="left">৳0</div>
    <p class="hsub"><span data-i="todaySpent"></span>: <b id="sToday"></b></p>
    <div class="hstats">
      <div><small data-i="incomeT"></small><b id="sInc"></b></div>
      <div><small data-i="fixedT"></small><b id="sFix"></b></div>
      <div><small data-i="spentT"></small><b id="sExp"></b></div>
      <div><small data-i="savedT"></small><b id="sSav"></b></div>
    </div>
    <p class="hsub" id="hLoan" style="margin-top:12px"></p>
  </div>

  <form class="card" id="fExp" autocomplete="off">
    <h2 data-i="addExpense"></h2>
    <div class="chips" id="catChips"></div>
    <input type="hidden" id="eCat" value="food">
    <div class="row">
      <div><label data-i="amount"></label><input id="eAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
      <div><label data-i="date"></label><input id="eDate" type="date"></div>
    </div>
    <label data-i="note"></label><input id="eNote" maxlength="80">
    <div class="err" id="eErr"></div>
    <button class="btn" data-i="add"></button>
  </form>

  <div class="card">
    <div class="chead"><h2 data-i="last7"></h2><b id="wkTot"></b></div>
    <div class="bars" id="week"></div>
  </div>

  <div class="card">
    <div class="chead"><h2 data-i="pieTitle"></h2></div>
    <div id="pie"></div>
  </div>

  <div class="card">
    <h2 data-i="recent"></h2>
    <ul id="expList"></ul>
  </div>

  <div class="card">
    <div class="chead"><h2 data-i="thisMonth"></h2><span class="muted" id="mName"></span></div>
    <div class="grid4" style="margin-top:0">
      <div class="stat"><small data-i="incomeT"></small><b id="mInc"></b></div>
      <div class="stat"><small data-i="fixedT"></small><b id="mFix"></b></div>
      <div class="stat"><small data-i="spentT"></small><b id="mExp"></b></div>
      <div class="stat"><small data-i="savedT"></small><b id="mSav"></b></div>
    </div>
    <p class="muted" style="margin-top:10px"><span data-i="leftMonth"></span>: <b id="mLeft"></b></p>
    <h2 style="margin-top:16px" data-i="history"></h2>
    <ul id="monList"></ul>
  </div>
</section>

<!-- INCOME + FIXED -->
<section id="income">
  <div class="card">
    <div class="grid4" style="margin-top:0">
      <div class="stat"><small data-i="totalIncome"></small><b id="tInc"></b></div>
      <div class="stat"><small data-i="totalFixed"></small><b id="tFix"></b></div>
    </div>
    <p class="muted" style="margin-top:10px"><span data-i="moneyLeft"></span>: <b id="tLeft"></b></p>
    <h2 style="margin-top:16px" data-i="bySource"></h2>
    <div id="srcList"></div>
  </div>
  <form class="card" id="fInc" autocomplete="off">
    <h2 data-i="addIncome"></h2>
    <div class="chips" id="incChips"></div>
    <input type="hidden" id="iType" value="salary">
    <div class="row">
      <div><label data-i="amount"></label><input id="iAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
      <div><label data-i="date"></label><input id="iDate" type="date"></div>
    </div>
    <label data-i="source"></label><input id="iNote" maxlength="80">
    <div class="err" id="iErr"></div>
    <button class="btn" data-i="add"></button>
  </form>
  <form class="card" id="fFix" autocomplete="off">
    <h2 data-i="addFixed"></h2>
    <div class="row">
      <div><label data-i="amount"></label><input id="xAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
      <div><label data-i="type"></label><select id="xType"></select></div>
    </div>
    <div class="row">
      <div><label data-i="note"></label><input id="xNote" maxlength="80"></div>
      <div><label data-i="date"></label><input id="xDate" type="date"></div>
    </div>
    <div class="err" id="xErr"></div>
    <button class="btn" data-i="add"></button>
  </form>
  <div class="card"><h2 data-i="incomeList"></h2><ul id="incList"></ul></div>
  <div class="card"><h2 data-i="fixedList"></h2><ul id="fixList"></ul></div>
</section>

<!-- SAVINGS -->
<section id="savings">
  <div class="card">
    <div class="muted" data-i="totalSaved"></div>
    <div class="big pos" id="savTotal"></div>
    <p class="muted" style="margin-top:6px" data-i="savNote"></p>
  </div>
  <form class="card" id="fSav" autocomplete="off">
    <h2 data-i="addSaving"></h2>
    <div class="row">
      <div><label data-i="amount"></label><input id="sAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
      <div><label data-i="date"></label><input id="sDate" type="date"></div>
    </div>
    <label data-i="note"></label><input id="sNote" maxlength="80">
    <div class="err" id="sErr"></div>
    <button class="btn" data-i="add"></button>
  </form>
  <div class="card"><h2 data-i="savingList"></h2><ul id="savList"></ul></div>
</section>

<!-- NEEDS -->
<section id="needs">
  <div class="card">
    <div class="grid4" style="margin-top:0">
      <div class="stat"><small data-i="needTotal"></small><b id="nTotal"></b></div>
      <div class="stat"><small data-i="moneyLeft"></small><b id="nLeft"></b></div>
    </div>
    <div class="bar"><i id="nBar" style="width:0"></i></div>
    <p id="nMsg" style="margin-top:10px;font-size:14px"></p>
  </div>
  <form class="card" id="fNeed" autocomplete="off">
    <h2 data-i="addNeed"></h2>
    <div class="row">
      <div style="flex:1.6"><label data-i="item"></label><input id="nName" maxlength="60"></div>
      <div><label data-i="estPrice"></label><input id="nPrice" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
    </div>
    <div class="err" id="nErr"></div>
    <button class="btn" data-i="add"></button>
  </form>
  <div class="card"><h2 data-i="needList"></h2><ul id="needList"></ul></div>
</section>

<!-- LOAN -->
<section id="loan">
  <div class="card">
    <div class="grid4" style="margin-top:0">
      <div class="stat"><small data-i="iOwe"></small><b id="lOwe" class="neg"></b></div>
      <div class="stat"><small data-i="owedMe"></small><b id="lOwed" class="pos"></b></div>
    </div>
    <p class="muted" style="margin-top:10px" data-i="loanNote"></p>
  </div>
  <form class="card" id="fLoan" autocomplete="off">
    <h2 data-i="addLoan"></h2>
    <label data-i="loanType"></label><select id="lType"></select>
    <div class="row">
      <div style="flex:1.4"><label data-i="person"></label><input id="lName" maxlength="40"></div>
      <div><label data-i="amount"></label><input id="lAmt" type="number" inputmode="decimal" step="any" min="0" placeholder="0"></div>
    </div>
    <div class="row">
      <div><label data-i="date"></label><input id="lDate" type="date"></div>
      <div><label data-i="dueDate"></label><input id="lDue" type="date"></div>
    </div>
    <label data-i="note"></label><input id="lNote" maxlength="80">
    <div class="err" id="lErr"></div>
    <button class="btn" data-i="add"></button>
  </form>
  <div class="card"><h2 data-i="takenList"></h2><ul id="takeList"></ul></div>
  <div class="card"><h2 data-i="givenList"></h2><ul id="giveList"></ul></div>
  <div class="card"><h2 data-i="closedList"></h2><ul id="closedList"></ul></div>
</section>

<!-- AI -->
<section id="ai">
  <div class="card">
    <h2 data-i="aiTitle"></h2>
    <p class="muted" data-i="aiSub"></p>
  </div>
  <div id="insights"></div>
</section>
</main>

<nav id="nav">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i="home"></span></button>
  <button data-t="income"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M8 12.5l4 4 4-4"/></svg><span data-i="income"></span></button>
  <button data-t="savings"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3"/><path d="M7 20v1.5M17 20v1.5"/></svg><span data-i="savings"></span></button>
  <button data-t="needs"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 1.5-2M4 12l1 1 1.5-2M4 18l1 1 1.5-2"/></svg><span data-i="needs"></span></button>
  <button data-t="loan"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg><span data-i="loan"></span></button>
  <button data-t="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg><span data-i="ai"></span></button>
</nav>

<script>
(function(){
"use strict";
var KEY="hisab_v1";
var $=function(id){return document.getElementById(id)};

/* ---------- Text (English / Bangla) ---------- */
var T={
en:{appName:"Hisab",home:"Home",income:"Income",savings:"Savings",needs:"Needs",ai:"AI",
moneyLeft:"Money left",incomeT:"Income",fixedT:"Fixed costs",spentT:"Spent",savedT:"Saved",todaySpent:"Spent today",
addExpense:"Add expense",amount:"Amount (৳)",category:"Category",note:"Note (optional)",date:"Date",add:"Add",
recent:"Recent expenses",noData:"Nothing added yet.",pieTitle:"Where your money goes (this month)",noPie:"No expenses this month yet.",
addIncome:"Add income",source:"Source / note (optional)",incomeList:"Income history",addFixed:"Add fixed cost",type:"Type",
fixedList:"Fixed cost history",totalIncome:"Total income",totalFixed:"Total fixed costs",totalSaved:"Total saved",
addSaving:"Add to savings",savingList:"Savings history",savNote:"Money you put into savings is taken out of \"Money left\", so you don't spend it by mistake.",
needTotal:"Still need to buy",addNeed:"Add an item",item:"Item",estPrice:"Est. price (৳)",needList:"My list",
afford:"You have enough money left to buy everything on your list.",short:"You are short by {x}.",nothingNeeded:"Your list is empty.",

/* ---------- Storage ---------- */
function def(){return{exp:[],inc:[],fix:[],sav:[],need:[],loan:[],lang:"en",
  theme:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}}
var S;
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Storage full")}render()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist()}

/* ---------- Helpers ---------- */
function t(k){return T[S.lang][k]||T.en[k]||k}
var BN="০১২৩৪৫৬৭৮৯";
function digits(s){return S.lang==="bn"?String(s).replace(/[0-9]/g,function(d){return BN[d]}):String(s)}
function r2(n){return Math.round(n*100)/100}
function fmt(n){n=r2(n);var neg=n<0;var s=Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2});return (neg?"-":"")+"৳"+digits(s)}
function num(n){return digits(n)}
function sum(a){return r2(a.reduce(function(s,x){return s+x.a},0))}
function pad(n){return (n<10?"0":"")+n}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dstr(new Date())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cat(id){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===id)return CATS[i];return CATS[CATS.length-1]}
function catName(id){var c=cat(id);return S.lang==="bn"?c[2]:c[1]}
function fixC(id){for(var i=0;i<FIX.length;i++)if(FIX[i][0]===id)return FIX[i];return FIX[FIX.length-1]}
function incC(id){for(var i=0;i<INC.length;i++)if(INC[i][0]===id)return INC[i];return INC[INC.length-1]}
function nm(c){return S.lang==="bn"?c[2]:c[1]}
function shortN(n){return n>=1000?digits((n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,""))+"k":digits(Math.round(n))}
function fixName(id){for(var i=0;i<FIX.length;i++)if(FIX[i][0]===id)return S.lang==="bn"?FIX[i][2]:FIX[i][1];return id}
function niceDate(ds){
  if(ds===today())return t("today");
  var y=new Date();y.setDate(y.getDate()-1);if(ds===dstr(y))return t("yesterday");
  var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(S.lang==="bn"?"bn-BD":"en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function byDateDesc(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1)}
function readAmt(id){var v=parseFloat(String($(id).value).replace(",","."));return isFinite(v)&&v>0?r2(v):0}

/* ---------- Totals ---------- */
function paid(x){return sum(x.pay||[])}
function remain(x){return r2(x.a-paid(x))}
function loanTotals(){
  var o={cash:0,owe:0,owed:0};
  S.loan.forEach(function(x){var p=paid(x),r=Math.max(0,x.a-p);
    if(x.t==="take"){o.cash+=x.a-p;o.owe+=r}else{o.cash-=x.a-p;o.owed+=r}});
  o.cash=r2(o.cash);o.owe=r2(o.owe);o.owed=r2(o.owed);return o;
}
function totals(){
  var inc=sum(S.inc),fix=sum(S.fix),exp=sum(S.exp),sav=sum(S.sav),L=loanTotals();
  return{inc:inc,fix:fix,exp:exp,sav:sav,owe:L.owe,owed:L.owed,left:r2(inc-fix-exp-sav+L.cash)};
}

/* ---------- Rendering ---------- */
function li(x,kind,title,sub,c,sign){
  return '<li>'+(c?'<span class="ico" style="background:'+c[3]+'22">'+c[4]+'</span>':'')+
  '<div class="li-main"><b>'+esc(title)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+
  '<span class="amt'+(sign==="+"?' pos':'')+'">'+(sign||"")+fmt(x.a)+'</span><button class="del" data-k="'+kind+'" data-id="'+x.id+'" aria-label="Delete">×</button></li>';
}
function simpleList(el,arr,kind,titleFn,cFn,sign){
  if(!arr.length){$(el).innerHTML='<li class="muted">'+t("noData")+'</li>';return}
  $(el).innerHTML=arr.slice().sort(byDateDesc).map(function(x){
    return li(x,kind,titleFn(x),niceDate(x.d)+(x.n?" · "+x.n:""),cFn(x),sign);
  }).join("");
}
function fillSelect(el,list,bn){
  var sel=$(el),v=sel.value;
  sel.innerHTML=list.map(function(c){return'<option value="'+c[0]+'">'+(bn?c[2]:c[1])+'</option>'}).join("");
  if(v)sel.value=v;
}

function renderExpenses(){
  var arr=S.exp.slice().sort(byDateDesc),MAX=60,h="",cur="";
  if(!arr.length){$("expList").innerHTML='<li class="muted">'+t("noData")+'</li>';return}
  var dayTot={};S.exp.forEach(function(x){dayTot[x.d]=(dayTot[x.d]||0)+x.a});
  arr.slice(0,MAX).forEach(function(x){
    if(x.d!==cur){cur=x.d;h+='<div class="day"><span>'+niceDate(x.d)+'</span><span>'+fmt(dayTot[x.d])+'</span></div>'}
    h+=li(x,"exp",catName(x.c),x.n,cat(x.c),"-");
  });
  if(arr.length>MAX)h+='<p class="muted" style="padding-top:8px">'+t("latest").replace("{n}",num(MAX))+'</p>';
  $("expList").innerHTML=h;
}

function monthLabel(m){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString(S.lang==="bn"?"bn-BD":"en-GB",{month:"long",year:"numeric"})}
function renderMonths(){
  var M={};function g(m){return M[m]||(M[m]={inc:0,fix:0,exp:0,sav:0})}
  S.inc.forEach(function(x){g(x.d.slice(0,7)).inc+=x.a});S.fix.forEach(function(x){g(x.d.slice(0,7)).fix+=x.a});
  S.exp.forEach(function(x){g(x.d.slice(0,7)).exp+=x.a});S.sav.forEach(function(x){g(x.d.slice(0,7)).sav+=x.a});
  var cur=today().slice(0,7),c=g(cur),ml=r2(c.inc-c.fix-c.exp-c.sav);
  $("mName").textContent=monthLabel(cur);
  $("mInc").textContent=fmt(c.inc);$("mFix").textContent=fmt(c.fix);$("mExp").textContent=fmt(c.exp);$("mSav").textContent=fmt(c.sav);
  $("mLeft").textContent=fmt(ml);$("mLeft").className=ml<0?"neg":"";
  var past=Object.keys(M).filter(function(m){return m<cur}).sort().reverse().slice(0,12);
  $("monList").innerHTML=past.length?past.map(function(m){var x=M[m];
    return'<li><div class="li-main"><b>'+monthLabel(m)+'</b><small>'+t("hInc")+' '+fmt(x.inc)+' · '+t("fixedT")+' '+fmt(x.fix)+'</small></div><span class="amt" style="text-align:right">'+t("hSpent")+' '+fmt(x.exp)+'<br><span class="pos">'+t("hSaved")+' '+fmt(x.sav)+'</span></span></li>';
  }).join(""):'<li class="muted">'+t("noHist")+'</li>';
}

function renderPie(){
  var mon=today().slice(0,7),by={},tot=0;
  S.exp.forEach(function(x){if(x.d.slice(0,7)===mon){by[x.c]=(by[x.c]||0)+x.a;tot+=x.a}});
  if(tot<=0){$("pie").innerHTML='<p class="muted">'+t("noPie")+'</p>';return}
  var rows=Object.keys(by).map(function(k){return[k,by[k]]}).sort(function(a,b){return b[1]-a[1]});
  var R=40,C=2*Math.PI*R,gap=rows.length>1?1.6:0,off=0;
  var svg='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--input)" stroke-width="12"/>';
  rows.forEach(function(r){
    var L=r[1]/tot*C,seg=Math.max(L-gap,.3);
    svg+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+cat(r[0])[3]+'" stroke-width="12" stroke-dasharray="'+seg.toFixed(3)+' '+(C-seg).toFixed(3)+'" stroke-dashoffset="'+(-off).toFixed(3)+'" transform="rotate(-90 50 50)"/>';
    off+=L;
  });
  svg+='</svg>';
  var leg=rows.map(function(r){var c=cat(r[0]),p=r[1]/tot*100;
    return'<div class="lg"><span class="ico sm" style="background:'+c[3]+'22">'+c[4]+'</span><div class="lgm"><div class="lgt"><b>'+esc(nm(c))+'</b><span>'+fmt(r[1])+'</span></div><div class="lgb"><i style="width:'+p.toFixed(1)+'%;background:'+c[3]+'"></i></div></div><span class="pct">'+(p<1?'<'+num(1):num(Math.round(p)))+'%</span></div>';
  }).join("");
  $("pie").innerHTML='<div class="donut">'+svg+'<div class="dc"><small>'+t("spentT")+'</small><b>'+fmt(tot)+'</b><small>'+monthLabel(mon)+'</small></div></div>'+leg;
}
function renderWeek(){
  var d=new Date(),days=[],mx=0,tot=0;
  for(var i=6;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i),ds=dstr(x);
    var v=sum(S.exp.filter(function(e){return e.d===ds}));days.push([x,v]);if(v>mx)mx=v;tot+=v}
  $("wkTot").textContent=fmt(tot);
  $("week").innerHTML=days.map(function(r,i){var h=mx>0?(r[1]>0?Math.max(r[1]/mx*100,7):0):0;
    return'<div class="bcol'+(i===6?' on':'')+'"><span class="bv">'+(r[1]>0?shortN(r[1]):'')+'</span><div class="btrack"><i style="height:'+h+'%"></i></div><small>'+r[0].toLocaleDateString(S.lang==="bn"?"bn-BD":"en-GB",{weekday:"short"})+'</small></div>';
  }).join("");
}
function chips(el,list,hid){
  var v=$(hid).value;
  $(el).innerHTML=list.map(function(c){return'<button type="button" class="chip'+(c[0]===v?' on':'')+'" data-h="'+hid+'" data-c="'+c[0]+'"><span>'+c[4]+'</span>'+esc(nm(c))+'</button>'}).join("");
}
function renderSources(){
  var by={},tot=0;S.inc.forEach(function(x){var k=x.c||"other";by[k]=(by[k]||0)+x.a;tot+=x.a});
  if(tot<=0){$("srcList").innerHTML='<p class="muted">'+t("noData")+'</p>';return}
  $("srcList").innerHTML=INC.filter(function(c){return by[c[0]]}).sort(function(a,b){return by[b[0]]-by[a[0]]}).map(function(c){var p=by[c[0]]/tot*100;
    return'<div class="lg"><span class="ico sm" style="background:'+c[3]+'22">'+c[4]+'</span><div class="lgm"><div class="lgt"><b>'+esc(nm(c))+'</b><span>'+fmt(by[c[0]])+'</span></div><div class="lgb"><i style="width:'+p.toFixed(1)+'%;background:'+c[3]+'"></i></div></div><span class="pct">'+num(Math.round(p))+'%</span></div>';
  }).join("");
}

function renderNeeds(left){
  var pend=r2(S.need.filter(function(x){return!x.b}).reduce(function(s,x){return s+x.a},0));
  $("nTotal").textContent=fmt(pend);$("nLeft").textContent=fmt(left);
  $("nLeft").className=left<0?"neg":"";
  var pct=pend>0?Math.min(100,Math.max(0,left/pend*100)):100;
  $("nBar").style.width=pct+"%";
  var m=$("nMsg");
  if(!S.need.length){m.textContent=t("nothingNeeded");m.className="muted"}
  else if(left>=pend){m.textContent=t("afford");m.className="pos"}
  else{m.textContent=t("short").replace("{x}",fmt(pend-Math.max(left,0)));m.className="neg"}
  if(!S.need.length){$("needList").innerHTML='<li class="muted">'+t("noData")+'</li>';return}
  var arr=S.need.slice().sort(function(a,b){return(a.b-b.b)||(a.id<b.id?1:-1)});
  $("needList").innerHTML=arr.map(function(x){
    return'<li class="'+(x.b?"done":"")+'"><input type="checkbox" class="chk" data-id="'+x.id+'"'+(x.b?" checked":"")+' aria-label="bought"><div class="li-main"><b>'+esc(x.name)+'</b></div><span class="amt">'+fmt(x.a)+'</span><button class="del" data-k="need" data-id="'+x.id+'" aria-label="Delete">×</button></li>';
  }).join("");
}

function loanItem(x){
  var pd=paid(x),rem=remain(x),closed=rem<=0,od=!closed&&x.due&&x.due<today(),take=x.t==="take";
  var h='<li class="loan"><div class="lhead"><b>'+esc(x.p)+'</b><span class="amt '+(closed?'':(take?'neg':'pos'))+'">'+fmt(closed?x.a:rem)+'</span>'+
    '<button class="del" data-k="loan" data-id="'+x.id+'" aria-label="Delete">×</button></div>'+
    '<small class="muted">'+esc((closed?(take?t("iOwe"):t("owedMe"))+" · ":"")+niceDate(x.d)+(x.n?" · "+x.n:""))+'</small><div class="tags">';
  if(closed)h+='<span class="tag">'+t("settled")+'</span>';
  else{

  }

  if(!closed)h+='<form class="payF" data-id="'+x.id+'" autocomplete="off"><input type="number" inputmode="decimal" step="any" min="0" placeholder="'+fmt(rem)+' '+t("left")+'"><button class="pbtn">'+t(take?"payBack":"gotBack")+'</button></form><div class="err"></div>';

  }).join("")+'</div>';

function insights(tt){
  var L=AI[S.lang],out=[],now=new Date(),td=today(),mon=td.slice(0,7);
  var dom=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var inMon=function(x){return x.d.slice(0,7)===mon};
  var mExp=S.exp.filter(inMon),mSpent=sum(mExp),mInc=sum(S.inc.filter(inMon)),mFix=sum(S.fix.filter(inMon)),mSav=sum(S.sav.filter(inMon));
  var pend=S.need.filter(function(x){return!x.b}).reduce(function(s,x){return s+x.a},0);

  if(tt.left<0)out.push(["warn",L.neg(fmt(tt.left))]);
  if(mInc>0&&mSpent+mFix>mInc)out.push(["warn",L.over(fmt(mSpent+mFix-mInc))]);
  else if(mInc>0&&(mSpent+mFix)/mInc>=0.8)out.push(["warn",L.near(num(Math.round((mSpent+mFix)/mInc*100)))]);

  if(!mExp.length){
    if(!S.exp.length&&!out.length)out.push(["info",L.empty]);
  }else{
    var by={};mExp.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
    var topK=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0],topP=Math.round(by[topK]/mSpent*100);
    out.push(["info",L.top(catName(topK),fmt(by[topK]),num(topP))]);
    if(topP>=40&&Object.keys(by).length>1)out.push(["warn",L.heavy(catName(topK),num(topP))]);

    var avg=mSpent/dom,rem=dim-dom+1;
    if(tt.left>0&&avg>0){
      var lasts=Math.floor(tt.left/avg);
      if(lasts<rem)out.push(["warn",L.pace(fmt(avg),num(lasts),num(rem),fmt(tt.left/rem))]);
      else out.push(["good",L.ok(fmt(avg),fmt(tt.left/rem))]);
    }
    var todaySp=sum(mExp.filter(function(x){return x.d===td}));
    if(dom>3){var prevAvg=(mSpent-todaySp)/(dom-1);if(prevAvg>0&&todaySp>prevAvg*1.5)out.push(["warn",L.todayHigh(fmt(todaySp),fmt(prevAvg))])}

    var lm=new Date(now.getFullYear(),now.getMonth()-1,1),lmStr=dstr(lm).slice(0,7);
    var lastSame=sum(S.exp.filter(function(x){return x.d.slice(0,7)===lmStr&&+x.d.slice(8)<=dom}));
    if(lastSame>0){var ch=Math.round((mSpent-lastSame)/lastSame*100);
      if(ch>=10)out.push(["warn",L.up(num(ch))]);else if(ch<=-10)out.push(["good",L.down(num(-ch))])}

    var sm=mExp.filter(function(x){return x.a<100});
    var smT=sum(sm);if(sm.length>=5&&smT>=mSpent*0.1)out.push(["info",L.small(num(sm.length),fmt(smT),fmt(100))]);

    var big=mExp.reduce(function(m,x){return x.a>m.a?x:m},mExp[0]);
    if(mExp.length>2)out.push(["info",L.biggest(fmt(big.a),catName(big.c),niceDate(big.d))]);
  }
  if(mInc>0){var sp=Math.round(mSav/mInc*100);
    if(sp>=20)out.push(["good",L.savGood(num(sp))]);else out.push(["info",L.savLow(num(sp))])}
  if(pend>0){if(pend>tt.left)out.push(["warn",L.needShort(fmt(pend-Math.max(tt.left,0)))]);else out.push(["good",L.needOk])}

  var td2=today();
  S.loan.forEach(function(x){var r=remain(x);if(r>0&&x.due&&x.due<td2)out.push(["warn",(x.t==="take"?L.odTake:L.odGive)(x.p,fmt(r),niceDate(x.due))])});
  if(tt.owe>0){out.push(["info",L.owe(fmt(tt.owe))]);if(tt.left-tt.owe<0)out.push(["warn",L.ownMoney(fmt(tt.left-tt.owe))])}
  if(tt.owed>0)out.push(["info",L.owedMe(fmt(tt.owed))]);

  /* warnings first */
  var order={warn:0,info:1,good:2};
  out.sort(function(a,b){return order[a[0]]-order[b[0]]});
  $("insights").innerHTML=out.map(function(o){return'<div class="ins '+o[0]+'">'+esc(o[1])+'</div>'}).join("");
}

  var els=document.querySelectorAll("[data-i]");
  for(var i=0;i<els.length;i++)els[i].textContent=t(els[i].getAttribute("data-i"));

  simpleList("fixList",S.fix,"fix",function(x){return fixName(x.c)},function(x){return fixC(x.c)},"-");
  simpleList("savList",S.sav,"sav",function(){return t("savedT")},function(){return["sav","","","#12a150","🏦"]});
  renderNeeds(tt.left);
  renderLoans(tt);
  insights(tt);
}

/* ---------- Forms ---------- */
function bind(formId,amtId,errId,build,listKey,reset){
  $(formId).addEventListener("submit",function(e){
    e.preventDefault();
    var a=readAmt(amtId);
    if(!a){$(errId).textContent=t("badAmt");return}
    $(errId).textContent="";
    var item=build(a);if(!item)return;
    S[listKey].push(item);
    reset.forEach(function(id){$(id).value=""});
    document.activeElement&&document.activeElement.blur();
    save();
  });
}
bind("fExp","eAmt","eErr",function(a){return{id:uid(),a:a,c:$("eCat").value,n:$("eNote").value.trim(),d:$("eDate").value||today()}},"exp",["eAmt","eNote"]);
bind("fInc","iAmt","iErr",function(a){return{id:uid(),a:a,c:$("iType").value,n:$("iNote").value.trim(),d:$("iDate").value||today()}},"inc",["iAmt","iNote"]);
bind("fFix","xAmt","xErr",function(a){return{id:uid(),a:a,c:$("xType").value,n:$("xNote").value.trim(),d:$("xDate").value||today()}},"fix",["xAmt","xNote"]);
bind("fSav","sAmt","sErr",function(a){return{id:uid(),a:a,n:$("sNote").value.trim(),d:$("sDate").value||today()}},"sav",["sAmt","sNote"]);

bind("fLoan","lAmt","lErr",function(a){

/* repayments (pay back / got back) */
document.addEventListener("submit",function(e){
  var f=e.target;if(!f.classList||!f.classList.contains("payF"))return;
  e.preventDefault();
  var id=f.getAttribute("data-id"),inp=f.querySelector("input"),er=f.nextElementSibling;
  var a=parseFloat(String(inp.value).replace(",","."));a=isFinite(a)&&a>0?r2(a):0;
  var x=S.loan.filter(function(l){return l.id===id})[0];if(!x)return;
  if(!a){er.textContent=t("badAmt");return}
  var rem=remain(x);if(a>rem){er.textContent=t("tooMuch").replace("{x}",fmt(rem));return}
  (x.pay=x.pay||[]).push({id:uid(),a:a,d:today()});
  document.activeElement&&document.activeElement.blur();
  save();
});

/* delete + bought (one listener for everything) */
document.addEventListener("click",function(e){
  var b=e.target.closest(".del");
  if(b){if(!confirm(t("delQ")))return;var k=b.getAttribute("data-k"),id=b.getAttribute("data-id");
    if(k==="pay"){var lid=b.getAttribute("data-loan");S.loan.forEach(function(l){if(l.id===lid)l.pay=(l.pay||[]).filter(function(p){return p.id!==id})});save();return}
    S[k]=S[k].filter(function(x){return x.id!==id});save();return}
  var ch=e.target.closest(".chip");
  if(ch){$(ch.getAttribute("data-h")).value=ch.getAttribute("data-c");render();return}
  var n=e.target.closest("nav button");
  if(n){var tab=n.getAttribute("data-t");
    var secs=document.querySelectorAll("section");for(var i=0;i<secs.length;i++)secs[i].classList.toggle("on",secs[i].id===tab);
    var bs=document.querySelectorAll("nav button");for(var j=0;j<bs.length;j++)bs[j].classList.toggle("on",bs[j]===n);
    window.scrollTo(0,0)}
});
document.addEventListener("change",function(e){
  if(e.target.classList.contains("chk")){var id=e.target.getAttribute("data-id");
    S.need.forEach(function(x){if(x.id===id)x.b=e.target.checked?1:0});save()}
});
$("langBtn").onclick=function(){S.lang=S.lang==="en"?"bn":"en";save()};
$("themeBtn").onclick=function(){S.theme=S.theme==="dark"?"light":"dark";save()};

/* default dates = today (also refreshed when the app is reopened on a new day) */
var lastDay="";
function setDates(){var d=today();if(d===lastDay)return;lastDay=d;["eDate","iDate","xDate","sDate","lDate"].forEach(function(id){$(id).value=d});render()}
document.addEventListener("visibilitychange",function(){if(!document.hidden)setDates()});
setDates();
setInterval(setDates,60000);

/* auto update: checks for a new version whenever the phone is online (Wi-Fi or data) */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  var hadSW=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
    function check(){if(navigator.onLine)reg.update().catch(function(){})}
    window.addEventListener("online",check);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
    setInterval(check,30*60000);
  });
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadSW&&!reloaded){reloaded=true;location.reload()}});
}
})();
